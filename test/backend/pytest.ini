# Backend tests live outside the backend package.
# Run from repo root:   uv run --project backend pytest test/backend/<feature>
# Run everything:       uv run --project backend pytest test/backend
[pytest]
pythonpath = ../../backend . knowledge
addopts = --import-mode=importlib -q
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
markers =
    postgres: needs a real PostgreSQL (TEST_DATABASE_URL)
filterwarnings =
    ignore::DeprecationWarning

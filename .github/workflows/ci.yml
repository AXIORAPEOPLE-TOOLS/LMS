# CI: every push to main and every pull request.
# Same checks as `bash deploy/ci/check.sh` locally (see docs/testing.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # the deploy workflow runs every check first

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"
  PNPM_VERSION: "12"

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend - lint, tests, docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install
        run: uv sync --project backend --locked
      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check app
      - name: Ruff format
        working-directory: backend
        run: uv run ruff format --check app
      - name: Tests (SQLite, includes the migration drift test)
        run: uv run --project backend pytest test/backend
      - name: API and data-model docs are up to date
        working-directory: backend
        run: |
          uv run python scripts/gen_docs.py
          git diff --exit-code -- ../docs/api.md ../docs/data-model.md \
            || (echo "::error::docs/api.md or docs/data-model.md is stale. Run: cd backend && uv run python scripts/gen_docs.py" && exit 1)

  backend-postgres:
    name: Backend - PostgreSQL (migrations + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LMS_DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/lms_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/lms_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --project backend --locked
      - name: Migrations up, down and up again (production uses PostgreSQL)
        working-directory: backend
        run: |
          uv run python -m app.cli migrate
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Tests on PostgreSQL
        run: uv run --project backend pytest test/backend

  frontend:
    name: Frontend - lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: ESLint
        working-directory: frontend
        run: pnpm lint
      - name: Type check and build
        working-directory: frontend
        run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  deploy-files:
    name: Deploy files - Docker image, Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image builds (the one used by every profile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose files are valid
        run: |
          touch backend/.env
          for f in deploy/compose.simple.yml deploy/compose.single.yml deploy/compose.aws-local.yml; do docker compose -f "$f" config -q; done
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
      - name: Terraform format and validate
        working-directory: deploy/aws
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  e2e:
    name: End-to-end (Playwright, phone + desktop)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --locked
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            test/e2e/pnpm-lock.yaml
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright
        working-directory: test/e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Run (starts its own backend on SQLite and the Vite dev server)
        working-directory: test/e2e
        run: pnpm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            test/e2e/playwright-report
            test/e2e/test-results
          retention-days: 7

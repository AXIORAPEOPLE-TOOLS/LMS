# Profile "single": one server, API + worker + its own Redis (BullMQ). Files on a local volume.
# Scale the worker on the same box if needed:  --scale worker=3
#   docker compose -f deploy/compose.single.yml --env-file backend/.env up -d --build
services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Jobs must survive a restart: append-only file on, never evict queue keys.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: lms:latest
    restart: unless-stopped
    ports: ["8000:8000"]
    env_file: ../backend/.env
    environment: &single
      LMS_DEPLOY_PROFILE: single
      LMS_QUEUE_BACKEND: bullmq
      LMS_REDIS_URL: redis://redis:6379/0
      LMS_SCHEDULER_ENABLED: "false" # the worker runs it
    volumes:
      - uploads:/data/uploads
    depends_on:
      redis: { condition: service_healthy }

  worker:
    image: lms:latest
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true # the image health check probes the API port; the worker has none
    env_file: ../backend/.env
    environment: *single
    volumes:
      - uploads:/data/uploads
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_started } # api runs the migrations first
    stop_grace_period: 60s

volumes:
  redis:
  uploads:

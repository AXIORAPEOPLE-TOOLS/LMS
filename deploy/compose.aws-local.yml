# Try the "scalable" profile on your machine: ElasticMQ (speaks SQS) + S3Mock (speaks S3).
#   docker compose -f deploy/compose.aws-local.yml up -d
# then in backend/.env (or the shell):
#   LMS_DEPLOY_PROFILE=scalable
#   LMS_SQS_ENDPOINT_URL=http://localhost:9324
#   LMS_S3_ENDPOINT_URL=http://localhost:9000
#   LMS_S3_BUCKET=lms-files
#   LMS_SCHEDULER_SOURCE=worker
#   AWS_ACCESS_KEY_ID=local  AWS_SECRET_ACCESS_KEY=localsecret  AWS_REGION=ap-southeast-1
# and run the API and `uv run python -m app.worker` as usual. Queues are created on first use.
# (MinIO no longer publishes free Docker images, so S3Mock stands in for S3. Files are kept in memory.)
services:
  sqs:
    image: softwaremill/elasticmq-native:1.7.1
    ports: ["9324:9324", "9325:9325"] # 9325 = web page with queue depths
  s3:
    image: adobe/s3mock:5.2.3
    ports: ["9000:9090"]
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: lms-files
